# Synthetic example config for the local Solo API-edge spike.
# This file is intentionally kept in sync with the runtime policy generated by render_config.py.
gateways:
  default:
    port: 8080
    bindAddress: 0.0.0.0
    jwtAuth:
      mode: strict
      issuer: "https://login.microsoftonline.com/11111111-2222-3333-4444-555555666666/v2.0"
      audiences:
        - "api://agent-a-example"
      jwks:
        url: "http://jwks-fixture:8081/.well-known/jwks.json"
      jwtValidationOptions:
        requiredClaims:
          - exp
          - nbf
          - iss
          - aud
    authorization:
      rules:
        - allow: "jwt.iat > 0 && jwt.tid == '11111111-2222-3333-4444-555555666666' && jwt.azp == 'synthetic-client' && jwt.scp.split(' ').exists(scope, scope == 'AgentA.Access')"
routes:
  - name: mock-agent-a
    matches:
      - path:
          pathPrefix: /
    backends:
      - host: "mock-agent-a:8080"
