services:
  mock-agent-a:
    build:
      context: ./mock-agent-a
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080', timeout=2).read()"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - solo-agent-edge

  jwks-fixture:
    build:
      context: ./jwks-fixture
    environment:
      JWKS_FILE: /data/jwks.json
    volumes:
      - ${JWKS_FILE_DIR:-./fixtures}:/data:ro
    expose:
      - "8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/.well-known/jwks.json', timeout=2).read()"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - solo-agent-edge

  agentgateway:
    image: cr.agentgateway.dev/agentgateway:v1.6.0
    depends_on:
      mock-agent-a:
        condition: service_healthy
      jwks-fixture:
        condition: service_healthy
    ports:
      - "${HOST_PORT:-18080}:8080"
    volumes:
      - ${AG_CONFIG_PATH:-./agentgateway/config.yaml}:/etc/agentgateway/config.yaml:ro
    command: ["-f", "/etc/agentgateway/config.yaml"]
    networks:
      - solo-agent-edge

networks:
  solo-agent-edge:
    driver: bridge
