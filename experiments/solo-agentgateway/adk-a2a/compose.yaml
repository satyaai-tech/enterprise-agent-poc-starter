services:
  agent-b:
    build:
      context: ../../../
      dockerfile: experiments/solo-agentgateway/adk-a2a/Dockerfile
    environment:
      PYTHONPATH: /workspace
      OLLAMA_MODEL: qwen3:8b
      OLLAMA_API_BASE: http://host.docker.internal:11434
      A2A_HOST: 0.0.0.0
      A2A_PORT: "8001"
      A2A_PUBLIC_URL: http://127.0.0.1:${HOST_PORT:-18081}
    expose:
      - "8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/.well-known/agent-card.json', timeout=5).read()"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - adk-a2a-private

  agentgateway:
    image: cr.agentgateway.dev/agentgateway:v1.6.0
    depends_on:
      agent-b:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HOST_PORT:-18081}:8080"
    volumes:
      - ${AG_CONFIG_PATH:-/tmp/solo-agentgateway-adk-a2a-config}:/etc/agentgateway:ro
    command: ["-f", "/etc/agentgateway/config.yaml"]
    networks:
      - adk-a2a-private

networks:
  adk-a2a-private:
    driver: bridge
