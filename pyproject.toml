[project]
name = "enterprise-agent-poc-starter"
version = "0.1.0"
description = "Phase 0 Microsoft Entra identity validation spike"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "google-adk[a2a]>=2.0.0,<3.0.0",
  "litellm>=1.84.0,<2.0.0",
  "msal>=1.31.0,<2.0",
  "PyJWT[crypto]>=2.10.1,<3.0",
  "python-dotenv>=1.0.1,<2.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.3,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
